<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Generador fotográfico</title><style>*{box-sizing:border-box}body{font:16px system-ui;background:#eef2f6;color:#17243a;margin:0}main{max-width:620px;margin:auto;padding:20px}canvas{width:100%;height:auto;border-radius:12px;touch-action:none}label{display:block;margin:14px 0 5px;font-weight:600}input,button{width:100%;padding:12px;font:inherit}button{background:#087a3b;color:white;border:0;border-radius:8px;margin-top:16px}button:disabled{opacity:.45}small{display:block;margin:10px 0}</style><main><h1>Generador fotográfico V3.2</h1><canvas id="c" width="1080" height="1080"></canvas><label for="photo">Fotografía obligatoria</label><input id="photo" type="file" accept="image/*"><label for="name">Nombre obligatorio</label><input id="name" maxlength="100" placeholder="Escribe tu nombre" required><label for="zoom">Tamaño de fotografía</label><input id="zoom" type="range" min="1" max="4" step=".01" value="1"><small>Arrastra la fotografía para ajustar su posición.</small><button id="save" disabled>Descargar PNG</button><small id="status" role="status"></small><small>La fotografía se procesa en este dispositivo.</small></main><script>const c=document.querySelector('#c'),g=c.getContext('2d'),photo=document.querySelector('#photo'),n=document.querySelector('#name'),z=document.querySelector('#zoom'),save=document.querySelector('#save'),status=document.querySelector('#status');const layout=Object.freeze({cx:790,cy:500,r:235,nameX:790,nameY:810,nameWidth:450});let img=null,x=0,y=0,drag=null,seq=0;function background(){const grad=g.createLinearGradient(0,0,1080,1080);grad.addColorStop(0,'#176b48');grad.addColorStop(1,'#103d32');g.fillStyle=grad;g.fillRect(0,0,1080,1080);g.textAlign='center';g.fillStyle='#ffffff';g.font='bold 48px system-ui';g.fillText('ESTUDIO FOTOGRÁFICO',540,120,960);g.fillStyle='#ffe000';g.font='900 84px system-ui';g.fillText('MI',270,460,450);g.fillText('RETRATO',270,555,450);g.beginPath();g.roundRect(565,750,450,100,45);g.fill();g.fillStyle='#ffffff';g.font='28px system-ui';g.fillText('Colección de retratos personales',540,1000,950)}function draw(){background();const {cx,cy,r,nameX,nameY,nameWidth}=layout,d=2*r;g.save();g.beginPath();g.arc(cx,cy,r,0,Math.PI*2);g.clip();g.fillStyle='#cbd5e1';g.fillRect(cx-r,cy-r,d,d);if(img){let s=Math.max(d/img.width,d/img.height)*Number(z.value),w=img.width*s,h=img.height*s;x=Math.max(-(w-d)/2,Math.min((w-d)/2,x));y=Math.max(-(h-d)/2,Math.min((h-d)/2,y));g.drawImage(img,cx-w/2+x,cy-h/2+y,w,h)}else{g.fillStyle='#53657a';g.font='32px system-ui';g.fillText('Tu fotografía',cx,cy+10)}g.restore();g.strokeStyle='#176b48';g.lineWidth=8;g.beginPath();g.arc(cx,cy,r+14,0,Math.PI*2);g.stroke();g.strokeStyle='white';g.lineWidth=10;g.beginPath();g.arc(cx,cy,r+5,0,Math.PI*2);g.stroke();g.fillStyle='#087a3b';let size=48;do{g.font=`bold ${size--}px system-ui`}while(g.measureText(n.value.trim()||'Tu nombre').width>nameWidth-30&&size>18);g.fillText(n.value.trim()||'Tu nombre',nameX,nameY,nameWidth-30);save.disabled=!(img&&n.value.trim())}photo.onchange=()=>{const f=photo.files[0],id=++seq;img=null;draw();if(!f)return;const u=URL.createObjectURL(f),i=new Image();i.onload=()=>{URL.revokeObjectURL(u);if(id!==seq)return;img=i;x=y=0;z.value=1;status.textContent='';draw()};i.onerror=()=>{URL.revokeObjectURL(u);if(id===seq)status.textContent='No se pudo abrir la fotografía. Prueba con JPG o PNG.'};i.src=u};n.oninput=z.oninput=draw;c.onpointerdown=e=>{if(!img)return;drag={a:e.clientX,b:e.clientY};c.setPointerCapture(e.pointerId)};c.onpointermove=e=>{if(!drag)return;let s=1080/c.getBoundingClientRect().width;x+=(e.clientX-drag.a)*s;y+=(e.clientY-drag.b)*s;drag={a:e.clientX,b:e.clientY};draw()};c.onpointerup=c.onpointercancel=()=>drag=null;save.onclick=()=>{if(!img||!n.value.trim())return;c.toBlob(b=>{if(!b){status.textContent='No se pudo exportar.';return}let u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download=n.value.trim().normalize('NFC').replace(/[^\p{L}\p{N}]+/gu,'_').replace(/^_+|_+$/g,'')+'_'+Date.now()+'.png';a.click();setTimeout(()=>URL.revokeObjectURL(u),30000)},'image/png')};draw();</script></html>
